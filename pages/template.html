<!DOCTYPE html>
<html lang="en">
<!--
  ============================================================================
  TEMPLATE.HTML - blank, commented copy of the captive portal page.
  ============================================================================

  HOW TO MAKE YOUR OWN JOKE PAGE
  ------------------------------
  1. Copy this file into pages/ with a new name, e.g. pages/my-joke.html
  2. Edit ONLY the places marked "EDIT ME" (mostly text and the jokeLines
     array). You never need to touch the CSS or the layout/JS logic.
  3. Flip the active page WITHOUT restarting anything:
         edit config.json -> "active_page": "my-joke.html"
     server.py re-reads config.json on every request, so the change is
     live for the very next client that loads the portal.

  RULES OF THE ROAD
  -----------------
  - No external fonts, images, scripts or stylesheets: the prank hotspot
    shares NO internet, so anything external simply won't load.
  - No login forms that validate or store credentials. Ever. If you add a
    fake "password" field, it must accept anything and store/log nothing.
  - The visit counter number is injected by server.py wherever the
    visit-counter placeholder marker appears (keep the marker intact -
    write it as an HTML comment in your page).
  ============================================================================
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- EDIT ME: shown in the browser tab / portal window title -->
  <title>My Joke Portal</title>
  <style>
    /* ==========================================
       Page layout. Mobile-first, single centered card, dark theme.
       You normally do NOT need to change anything in <style>.
       Change colors here only if you want a different palette.
       ========================================== */
    :root {
      --primary: #ff6b6b;   /* bar + button color */
      --secondary: #4ecdc4; /* small accent (badges, checkmarks) */
      --accent: #ffe66d;    /* punchline text color */
      --bg: #0d1117;        /* page background */
      --card: #161b22;      /* card / bar background */
      --text: #f8f8f2;      /* main text */
      --muted: #7d8590;     /* secondary text */
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      font-size: 1rem;
    }

    /* Progress bar container */
    #progress-container {
      width: 100%;
      max-width: 340px;
      margin: 2rem 0;
    }

    #progress-bar {
      width: 100%;
      height: 12px;
      background: var(--card);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }

    #progress-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.5s ease-out;
    }

    #progress-text {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      user-select: none;
    }

    /* Fake status lines: revealed one by one (JS adds .shown/.done) */
    #status-lines {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-top: 0.5rem;
      min-height: 5.5rem; /* reserve space so layout doesn't jump */
    }

    .status-line {
      font-size: 0.75rem;
      color: var(--muted);
      user-select: none;
      opacity: 0;               /* hidden until JS reveals it */
      transform: translateY(4px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .status-line.shown {
      opacity: 1;
      transform: none;
    }

    .status-line.done::before {
      content: "\2713 "; /* checkmark once "completed" */
      color: var(--secondary);
    }

    /* Fake speed-test result card, hidden until revealed */
    #speed-result {
      margin: 1.5rem 0;
      padding: 1rem;
      background: var(--card);
      border-radius: 8px;
      display: none;
      align-items: baseline;
      justify-content: center;
      gap: 0.5rem;
    }

    #speed-result.visible {
      display: flex;
      animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes pop-in {
      from { transform: scale(0.8); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    /* EDIT ME (optional): change these three spans in the HTML for your
       own "test result" joke, e.g. "Ping: Nope ms" or "Upload: 0 KB/s" */
    #speed-label { font-size: 0.9rem; font-weight: bold; color: var(--secondary); }
    #speed-value { font-size: 1.75rem; font-weight: bold; color: var(--muted); }
    #speed-unit  { font-size: 0.9rem; color: var(--muted); }

    /* Punchline area */
    #punchline {
      text-align: center;
      margin: 2rem 0;
    }

    #punchline-text {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--accent);
      min-height: 1.5em;
    }

    /* Cosmetic visit counter (server.py injects the number) */
    #visit-counter {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      min-height: 1em;
    }

    /* Confetti canvas - full-screen overlay, leave alone */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    /* Try Again button */
    #try-again {
      margin-top: 2rem;
      padding: 0.875rem 1.75rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    #try-again:hover {
      background: #ff5252;
    }

    /* Punchline shake animation */
    .shake {
      animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes shake {
      0%   { transform: rotate(0deg); }
      25%  { transform: rotate(-5deg); }
      50%  { transform: rotate(5deg); }
      75%  { transform: rotate(-3deg); }
      100% { transform: rotate(0deg); }
    }

    /* Respect users who ask for less motion */
    @media (prefers-reduced-motion: reduce) {
      #progress-fill { transition: width 0s; }
      .shake { animation: none; }
      #speed-result.visible { animation: none; }
    }
  </style>
</head>
<body>
  <!-- Confetti overlay (leave alone) -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Fake progress bar. EDIT ME: the initial text below if you like. -->
  <div id="progress-container">
    <div id="progress-bar">
      <div id="progress-fill"></div>
    </div>
    <div id="progress-text">Connecting to WiFi...</div>
  </div>

  <!-- EDIT ME: fake status lines - add/remove lines freely.
       The JS automatically spaces them out across the progress bar. -->
  <div id="status-lines">
    <div class="status-line">Authenticating with college network...</div>
    <div class="status-line">Obtaining IP address...</div>
    <div class="status-line">Establishing secure connection...</div>
    <div class="status-line">Finalizing handshake...</div>
  </div>

  <!-- EDIT ME: fake speed-test result (or reuse for another kind of readout) -->
  <div id="speed-result">
    <span id="speed-label">6G:</span>
    <span id="speed-value">0.0</span>
    <span id="speed-unit">Mbps</span>
  </div>

  <!-- EDIT ME: the opening punchline shown when the "connection" fails -->
  <div id="punchline">
    <div id="punchline-text">&nbsp;</div>
  </div>

  <!-- Try Again button (leave alone; wires to jokeLines below) -->
  <button id="try-again">Try Again</button>

  <!-- Cosmetic visit counter. KEEP THIS MARKER - server.py replaces it
       with "You are visitor #N today" on every request. -->
  <div id="visit-counter"><!-- VISIT_COUNTER_PLACEHOLDER --></div>

  <script>
    // ==========================================
    // EDIT ME: your joke lines. "Try Again" picks a different random
    // line from this array on every click (never twice in a row).
    // ==========================================
    const jokeLines = [
      // e.g. "Our WiFi is powered by a hamster on a treadmill.",
      // e.g. "Bandwidth: strictly limited to your imagination.",
    ];

    // EDIT ME: the opener revealed after the fake speed test
    const PUNCHLINE = "Your opening punchline goes here";
    let lastJokeIndex = -1; // internal: prevents repeats, leave alone

    // The visit counter is injected server-side by server.py where the
    // visit-counter placeholder marker sits in the HTML below. This page
    // stores and logs NOTHING about the visitor. No login form, no credentials.

    // ==========================================
    // Confetti system - leave this section alone
    // ==========================================
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let animationId = null;
    let confetti = [];

    const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#ffa726', '#5f27cd'];

    // rAF with fallbacks for older captive-portal webviews
    const requestFrame = window.requestAnimationFrame
      ? window.requestAnimationFrame.bind(window)
      : function (cb) { return setTimeout(cb, 1000 / 60); };

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function createPiece(x, y, color) {
      return {
        width: Math.random() * 10 + 5,
        height: Math.random() * 10 + 5,
        color: color,
        x: x,
        y: y,
        angle: Math.random() * 360,
        rotationSpeed: (Math.random() - 0.5) * 10,
        fallSpeed: Math.random() * 5 + 2
      };
    }

    function drawConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = confetti.length - 1; i >= 0; i--) {
        const piece = confetti[i];
        piece.y += piece.fallSpeed;
        piece.angle += piece.rotationSpeed;

        ctx.save();
        ctx.translate(piece.x + piece.width / 2, piece.y + piece.height / 2);
        ctx.rotate((piece.angle * Math.PI) / 180);
        ctx.fillStyle = piece.color;
        ctx.fillRect(-piece.width / 2, -piece.height / 2, piece.width, piece.height);
        ctx.restore();

        if (piece.y > canvas.height) {
          confetti.splice(i, 1);
        }
      }

      if (confetti.length > 0) {
        animationId = requestFrame(drawConfetti);
      } else {
        animationId = null;
      }
    }

    function launchConfetti() {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      for (let i = 0; i < 50; i++) {
        const color = colors[Math.floor(Math.random() * colors.length)];
        const piece = createPiece(centerX, centerY, color);
        const angle = (i / 50) * Math.PI * 2;
        const radius = 20;
        piece.x = centerX + Math.cos(angle) * radius;
        piece.y = centerY + Math.sin(angle) * radius;
        confetti.push(piece);
      }

      if (!animationId) {
        drawConfetti();
      }
    }

    // ==========================================
    // Progress simulation - leave this section alone.
    // Tweak STUCK_AT / STALL_MS only if you want to change the timing.
    // ==========================================
    const STUCK_AT = 97;   // percent where the bar freezes
    const STALL_MS = 2500; // ms it stays frozen before the reveal
    const statusEls = Array.from(document.querySelectorAll('.status-line'));

    function updateProgress(percent) {
      document.getElementById('progress-fill').style.width = percent + '%';
      document.getElementById('progress-text').textContent =
        `Connecting to WiFi... ${Math.floor(percent)}%`;

      // Reveal status lines as progress passes evenly spaced milestones
      const step = 100 / (statusEls.length + 1);
      statusEls.forEach((el, i) => {
        if (percent >= step * (i + 1)) el.classList.add('shown', 'done');
      });
    }

    function simulateConnection() {
      let percent = 0;
      updateProgress(percent);

      const interval = setInterval(() => {
        percent += Math.random() * 12 + 4;
        if (percent >= STUCK_AT) {
          percent = STUCK_AT;
          clearInterval(interval);
          document.getElementById('progress-text').textContent =
            `Still connecting... ${STUCK_AT}%`;
          statusEls.forEach(el => el.classList.add('shown'));

          setTimeout(() => {
            document.getElementById('progress-text').textContent = 'Connection failed.';
            showSpeedResult();
            showPunchline(PUNCHLINE);
            launchConfetti();
          }, STALL_MS);
        }
        updateProgress(percent);
      }, 250);
    }

    // Reveal the fake speed-test result
    function showSpeedResult() {
      document.getElementById('speed-result').classList.add('visible');
    }

    // Show a punchline with a shake animation
    function showPunchline(text) {
      const el = document.getElementById('punchline-text');
      el.textContent = text;
      el.classList.remove('shake');
      void el.offsetWidth; // force reflow so the shake replays
      el.classList.add('shake');
    }

    // Try Again button: different random joke line every click
    document.getElementById('try-again').addEventListener('click', () => {
      if (jokeLines.length === 0) {
        showPunchline(PUNCHLINE); // nothing to cycle yet
        return;
      }
      let index;
      do {
        index = Math.floor(Math.random() * jokeLines.length);
      } while (jokeLines.length > 1 && index === lastJokeIndex);
      lastJokeIndex = index;

      showPunchline(jokeLines[index]);
      launchConfetti();
    });

    // Kick off the fake connection sequence
    window.addEventListener('load', simulateConnection);
  </script>
</body>
</html>
